name: PR E2E Tests (CodeBuild)

on:
  issue_comment:
    types: [created]

# Scope cancellation to a single PR. For issue_comment events github.ref is
# always the default branch, so keying on it made a /test-e2e on any PR cancel
# in-flight runs on every other PR. Comments that are not /test-e2e get a
# unique group (run_id) so an ordinary PR comment never cancels a running E2E.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.issue.number }}-${{
    contains(github.event.comment.body, '/test-e2e') && 'e2e' || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write  # Required for OIDC authentication with AWS
  contents: read
  pull-requests: write  # To post comments back to the PR
  statuses: write  # To create commit status checks
  checks: write  # To create/update the check run shown in the PR Checks tab

env:
  # Public CodeBuild project page for clowder-pr-check; build pages are
  # <this>/build/<uuid>.
  CODEBUILD_PROJECT_URL: https://us-east-1.codebuild.aws.amazon.com/project/eyJlbmNyeXB0ZWREYXRhIjoiTHJVaVRGR05mWnExNnVLS3N1OWMrMGtFMEdYQnZ5VmVmMjJ6ZEFsYzdLQUc2WjViWTI2d3RLS21UalVWZHN3c2kwaytBMm1SaHZOVTd6elNGeGJaaEtnc0tKeUp0WTNOOUptOUIyMVBrZXRzIiwiaXZQYXJhbWV0ZXJTcGVjIjoiTS9ZYlZlTDA4M2F1cW1zMSIsIm1hdGVyaWFsU2V0U2VyaWFsIjoxfQ%3D%3D

jobs:
  trigger-codebuild:
    # Only run on PR comments that contain /test-e2e
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/test-e2e')

    runs-on: ubuntu-latest

    steps:
      - name: Check user permissions
        id: check-permissions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const username = context.payload.comment.user.login;

            try {
              const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: username
              });

              const permission = permissionData.permission;
              console.log(`User ${username} has permission: ${permission}`);

              // Allow admin, write, and maintain permissions
              const allowedPermissions = ['admin', 'write', 'maintain'];

              if (!allowedPermissions.includes(permission)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `@${username} Sorry, you don't have permission to trigger E2E tests. This command is restricted to repository maintainers.`
                });

                core.setFailed(`User ${username} does not have sufficient permissions (has: ${permission}, needs: ${allowedPermissions.join(', ')})`);
              }

              core.setOutput('allowed', 'true');
            } catch (error) {
              console.error('Error checking permissions:', error);
              core.setFailed('Failed to check user permissions');
            }

      - name: React to comment
        if: steps.check-permissions.outputs.allowed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get PR details
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('repo', pr.data.head.repo.clone_url);

      - name: Check if PR has buildspec.yml
        id: check-buildspec
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'buildspec.yml',
                ref: '${{ steps.pr.outputs.sha }}'
              });
              core.setOutput('has-buildspec', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('has-buildspec', 'false');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: '⚠️ This PR branch does not contain `buildspec.yml`, which is required to run E2E tests.\n\nPlease rebase this PR with the `master` branch to include the latest changes, then try `/test-e2e` again.'
                });
              } else {
                throw error;
              }
            }

      - name: Fail if buildspec.yml is missing
        if: steps.check-buildspec.outputs.has-buildspec == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const sha = process.env.PR_SHA;
            const description = 'PR needs rebase - buildspec.yml missing';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: 'failure',
              context: 'CodeBuild / E2E Tests',
              description: description
            });

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CodeBuild / E2E Tests',
              head_sha: sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: description,
                summary: 'This PR branch does not contain `buildspec.yml`. Rebase onto `master` and comment `/test-e2e` again.'
              }
            });

            core.setFailed('This PR branch does not contain buildspec.yml. Please rebase with master.');

      - name: Create pending status and check run
        id: check-run
        if: steps.check-permissions.outputs.allowed == 'true' && steps.check-buildspec.outputs.has-buildspec == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PROJECT_URL: ${{ env.CODEBUILD_PROJECT_URL }}
        with:
          script: |
            const sha = process.env.PR_SHA;
            const projectUrl = process.env.PROJECT_URL;

            // Legacy commit status, kept so any branch-protection rule that
            // requires the "CodeBuild / E2E Tests" status keeps working.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: 'pending',
              context: 'CodeBuild / E2E Tests',
              description: 'Running E2E tests...',
              target_url: projectUrl
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CodeBuild / E2E Tests',
              head_sha: sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: projectUrl,
              output: {
                title: 'Running E2E tests...',
                summary: `Triggered by @${context.actor} via \`/test-e2e\` on #${context.issue.number}.\n\n[GitHub Actions run](${runUrl})`
              }
            });
            core.setOutput('id', String(check.id));

      - name: Configure AWS credentials
        if: steps.check-buildspec.outputs.has-buildspec == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_CODEBUILD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run CodeBuild
        if: steps.check-buildspec.outputs.has-buildspec == 'true'
        id: codebuild
        uses: aws-actions/aws-codebuild-run-build@7e46c3fa1c1f217e26a73712796b1f78938b534b # v1.0.19
        with:
          hide-cloudwatch-logs: true
          project-name: clowder-pr-check
          source-version-override: ${{ steps.pr.outputs.sha }}
          # GitHub Actions silently ignores attempts to override default
          # GITHUB_* variables, so PR context is passed under PR_* names.
          env-vars-for-codebuild: |
            PR_NUMBER,
            PR_SHA,
            PR_REF,
            PR_ACTOR,
            PR_REPOSITORY
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PR_REF: ${{ steps.pr.outputs.ref }}
          PR_ACTOR: ${{ github.actor }}
          PR_REPOSITORY: ${{ github.repository }}

      # Runs on success, failure and cancellation so the status/check never
      # stays pending. Skipped when the run never got as far as posting
      # pending (permission denied, PR lookup failed, buildspec missing).
      - name: Report final status
        if: always() && steps.pr.outputs.sha != '' && steps.check-buildspec.outputs.has-buildspec == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PROJECT_URL: ${{ env.CODEBUILD_PROJECT_URL }}
          BUILD_ID: ${{ steps.codebuild.outputs.aws-build-id }}
          BUILD_OUTCOME: ${{ steps.codebuild.outcome }}
          JOB_STATUS: ${{ job.status }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
        with:
          script: |
            const sha = process.env.PR_SHA;
            const projectUrl = process.env.PROJECT_URL;
            const buildId = process.env.BUILD_ID || '';
            const buildOutcome = process.env.BUILD_OUTCOME || '';
            const jobStatus = process.env.JOB_STATUS || '';
            const checkRunId = process.env.CHECK_RUN_ID || '';

            // aws-build-id looks like "<project>:<uuid>"; the public build
            // page is keyed on the uuid.
            const buildUuid = buildId.includes(':') ? buildId.split(':')[1] : '';
            const buildUrl = buildUuid ? `${projectUrl}/build/${buildUuid}` : projectUrl;

            let state, conclusion, description;
            if (jobStatus === 'cancelled' || buildOutcome === 'cancelled') {
              state = 'error';
              conclusion = 'cancelled';
              description = 'E2E run was cancelled';
            } else if (buildOutcome === 'success' && jobStatus === 'success') {
              state = 'success';
              conclusion = 'success';
              description = 'E2E tests passed';
            } else if (buildUuid) {
              state = 'failure';
              conclusion = 'failure';
              description = 'E2E tests failed';
            } else {
              state = 'failure';
              conclusion = 'failure';
              description = 'Failed to start E2E tests';
            }
            console.log(`job=${jobStatus} codebuild=${buildOutcome} build=${buildId || '<none>'} -> ${conclusion}`);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = [
              `**Result:** ${description}`,
              '',
              `- Commit: \`${sha}\``,
              `- Triggered by: @${context.actor} on #${context.issue.number}`,
              buildUuid ? `- [CodeBuild build](${buildUrl})` : '- CodeBuild build: not started',
              `- [GitHub Actions run](${runUrl})`
            ].join('\n');

            // Report to both APIs independently so one failing doesn't
            // prevent the other from leaving pending.
            const results = await Promise.allSettled([
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: state,
                context: 'CodeBuild / E2E Tests',
                description: description,
                target_url: buildUrl
              }),
              (async () => {
                const params = {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status: 'completed',
                  conclusion: conclusion,
                  completed_at: new Date().toISOString(),
                  details_url: buildUrl,
                  output: { title: description, summary: summary }
                };
                if (checkRunId) {
                  await github.rest.checks.update({ ...params, check_run_id: Number(checkRunId) });
                } else {
                  await github.rest.checks.create({ ...params, name: 'CodeBuild / E2E Tests', head_sha: sha });
                }
              })()
            ]);

            const errors = results.filter(r => r.status === 'rejected').map(r => r.reason);
            if (errors.length) {
              errors.forEach(e => console.error(e));
              core.setFailed('Failed to report final E2E status to GitHub');
            }
